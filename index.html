<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f5;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: #d63384;
            color: white;
            text-align: center;
            padding: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 5px 0 0;
        }

        .products {
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .product {
            background: white;
            width: 220px;
            height: 280px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #999;
            text-align: center;
            padding: 12px;
        }

        .product img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product h2 {
            color: #d63384;
            margin: 8px;
            font-size: 20px;
        }

        footer {
            background: #d63384;
            color: white;
            text-align: center;
            padding: 15px;
            height: 25vh;
        }

        footer h2 {
            margin: 5px;
        }

        footer p {
            margin: 7px;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <header>
        <h1>💄 Beauty Products</h1>
        <p>Beauty • Makeup • Skincare</p>
    </header>

    <section class="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=500&q=80"
                 alt="Makeup Products">
            <h2>Makeup</h2>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1612817288484-6f916006741a?auto=format&fit=crop&w=500&q=80"
                 alt="Skincare Products">
            <h2>Skincare</h2>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=500&q=80"
                 alt="Beauty Products">
            <h2>Beauty Care</h2>
        </div>

    </section>

    <footer>
        <h2>📍 Address</h2>
        <p>123, Main Road, Your City</p>

        <h2>📱 Contact</h2>
        <p>Mobile: +91 98765 432
